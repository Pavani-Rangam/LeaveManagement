<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Attendance - TeamHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragments :: sidebar('attendance')}"></aside>
  <div class="main">
    <header th:replace="~{fragments :: topbar('Attendance')}"></header>
    <div th:replace="~{fragments :: flash}"></div>
    <div class="cardbox">
      <h3>Today</h3>
      <p th:if="${todayAtt == null}" class="muted">You have not checked in yet.</p>
      <p th:if="${todayAtt != null}">In: <b th:text="${#temporals.format(todayAtt.checkIn,'hh:mm a')}"></b>
        <span th:if="${todayAtt.checkOut != null}"> · Out: <b th:text="${#temporals.format(todayAtt.checkOut,'hh:mm a')}"></b> · <span th:text="${todayAtt.hours}"></span></span></p>
      <form method="post" action="/attendance/check-in" style="display:inline"><button class="btn">Check In</button></form>
      <form method="post" action="/attendance/check-out" style="display:inline"><button class="btn btn-red">Check Out</button></form>
    </div>
    <div class="cardbox">
      <h3 th:text="${me.manager} ? 'Attendance Records (all employees)' : 'My Attendance'">Records</h3>
      <table>
        <thead><tr><th th:if="${me.manager}">Employee</th><th>Date</th><th>Check In</th><th>Check Out</th><th>Hours</th></tr></thead>
        <tbody>
          <tr th:each="a : ${records}">
            <td th:if="${me.manager}" th:text="${a.employee.name}">Name</td>
            <td th:text="${#temporals.format(a.workDate,'dd MMM yyyy')}">date</td>
            <td th:text="${a.checkIn != null ? #temporals.format(a.checkIn,'hh:mm a') : '-'}">-</td>
            <td th:text="${a.checkOut != null ? #temporals.format(a.checkOut,'hh:mm a') : '-'}">-</td>
            <td th:text="${a.hours}">-</td>
          </tr>
        </tbody>
      </table>
      <p class="muted" th:if="${#lists.isEmpty(records)}">No attendance records yet.</p>
    </div>
  </div>
</div>
</body>
</html>
